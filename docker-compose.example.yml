---

services:
  proxy:
    build: container/proxy
    expose:
      - 1080
    ports:
      - 1080:1080
    networks:
      gosa:
        aliases:
          - proxy.gosa.example.com
    hostname: proxy.gosa.example.com
  pi-db:
    image: 'docker.io/bitnami/mariadb:latest'
    ports:
      - '3306:3306'
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=no
      - MARIADB_ROOT_PASSWORD=privacyidea
      - MARIADB_DATABASE=privacyidea
      - MARIADB_USER=privacyidea
      - MARIADB_PASSWORD=privacyidea@123
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/mariadb/healthcheck.sh"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      gosa:
  pi:
    build: container/pi
    depends_on:
      mariadb:
        condition: service_healthy
      gosa-ldap:
        condition: service_started
      gosa-ldap2:
        condition: service_started
    expose:
      - 80
      - 443
    ports:
      - 8082:80
    volumes:
      - type: bind
        source: ./var/certs
        target: /srv/certs
    networks:
      gosa:
        aliases:
          - pi.gosa.example.com
    hostname: pi.gosa.example.com
  mariadb:
    build: container/mariadb
    expose:
      - "3306"
    networks:
      gosa:
        aliases:
          - mysql.gosa.example.com
    hostname: mysql.gosa.example.com
    environment:
      MARIADB_ROOT_PASSWORD: mysql
  gosa-www:
    build:
      context: container/www
    volumes:
      - type: bind
        source: ./var/certs
        target: /srv/certs
      - type: bind
        source: ./container/www/assets/gosa2
        target: /srv/gosa/gosa/gosa-core
    depends_on:
      gosa-ldap:
        condition: service_started
      gosa-ldap2:
        condition: service_started
    extra_hosts:
      host.docker.internal: host-gateway
    networks:
      gosa:
        aliases:
          - gosa.gosa.example.com
    ports:
      - 8080:80
    expose:
      - 80
      - 443
    hostname: gosa.gosa.example.com
    environment:
      LDAP_LIST: "ldap://ldap.gosa.example.com ldap://ldap2.gosa.example.com"
      ROOT_DN: "cn=manager,dc=example,dc=com"
      ROOT_PW: "secret"
      USE_TLS: true
      GSA_UID: "gsa"
      GSA_PW: "tester"
  gosa-ldap:
    build:
      context: container/ldap
      args:
        HEALTHCHECK_LDAP_USER_DN: "cn=manager,dc=example,dc=com"
        HEALTHCHECK_LDAP_USER_PASSWORD: "secret"
        HEALTHCHECK_LDAP_BASE: "dc=example,dc=com"
        HEALTHCHECK_LDAP_URI: "ldap://ldap.gosa.example.com"
    networks:
      gosa:
        aliases:
          - ldap.gosa.example.com
    ports:
      - "127.0.0.1:3389:389"
      - "127.0.0.1:6636:636"
    expose:
      - "389"
      - "636"
    hostname: ldap.gosa.example.com
    volumes:
      - gosa-ldap-db:/var/lib/ldap
      - type: bind
        source: ./container/certs
        target: /certs/
  gosa-ldap2:
    build:
      context: container/ldap
      args:
        HEALTHCHECK_LDAP_USER_DN: "cn=manager,dc=example,dc=com"
        HEALTHCHECK_LDAP_USER_PASSWORD: "secret"
        HEALTHCHECK_LDAP_BASE: "dc=example,dc=com"
        HEALTHCHECK_LDAP_URI: "ldap://ldap2.gosa.example.com"
    networks:
      gosa:
        aliases:
          - ldap2.gosa.example.com
    ports:
      - "127.0.0.1:3899:389"
      - "127.0.0.1:6366:636"
    expose:
      - "389"
      - "636"
    hostname: ldap2.gosa.example.com
    volumes:
      - gosa-ldap2-db:/var/lib/ldap
      - type: bind
        source: ./container/certs
        target: /certs/
    depends_on:
      gosa-ldap:
        condition: service_started

volumes:
  gosa-ldap-db: {}
  gosa-ldap2-db: {}

networks:
  gosa:
